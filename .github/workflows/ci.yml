name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Type checking and linting
  quality-checks:
    runs-on: ubuntu-latest
    name: Code Quality Checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Run ESLint
        run: npm run lint

      - name: Check for console.log statements
        run: |
          if grep -r "console\.log" --include=\*.{ts,tsx,js,jsx} app/ components/ lib/ || true; then
            echo "⚠️ Warning: console.log statements found in code"
          fi
        continue-on-error: true

  # Build test
  build:
    runs-on: ubuntu-latest
    name: Build Test
    needs: quality-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Check build output
        run: |
          if [ ! -d ".next" ]; then
            echo "❌ Build failed - .next directory not found"
            exit 1
          fi
          echo "✅ Build successful"

  # Security checks
  security:
    runs-on: ubuntu-latest
    name: Security Audit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for secrets in code
        run: |
          if grep -r -i "api.key\|apikey\|api_key\|password\|secret" --include=\*.{ts,tsx,js,jsx} app/ components/ lib/ | grep -v "// " | grep -v "secretKey" || true; then
            echo "⚠️ Warning: Potential secrets found in code"
          fi
        continue-on-error: true

  # Deployment gate (only on main branch)
  deployment-gate:
    runs-on: ubuntu-latest
    name: Deployment Gate
    needs: [quality-checks, build, security]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: All checks passed
        run: echo "✅ All quality checks passed. Safe to deploy to production."
